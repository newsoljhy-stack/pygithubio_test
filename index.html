<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages에서 파이썬 실행하기</title>
    
    <!-- 1. PyScript 실행을 위한 CSS 및 JavaScript 로드 -->
    <link rel="stylesheet" href="https://pyscript.net">
    <script type="module" src="https://pyscript.net"></script>
</head>
<body>

    <h1>🧮 PyScript 제곱 계산기</h1>
    <p>GitHub Pages(브라우저)에서 서버 없이 파이썬 코드가 직접 실행됩니다.</p>

    <!-- 입력창과 버튼 생성 -->
    <input type="number" id="num-input" value="5" placeholder="숫자를 입력하세요">
    <button id="calc-btn">제곱 계산하기</button>
    
    <!-- 결과가 출력될 공간 -->
    <div id="output-box" style="margin-top: 20px; font-weight: bold; color: blue;"></div>

    <!-- 2. 파이썬 코드 작성 구역 -->
    <script type="py">
        from pyscript import document

        def calculate_square(event):
            # HTML 입력창에서 값 가져오기
            input_element = document.querySelector("#num-input")
            number_value = int(input_element.value)
            
            # 파이썬으로 계산 수행
            result = number_value ** 2
            
            # HTML 결과창에 텍스트 넣기
            output_element = document.querySelector("#output-box")
            output_element.innerText = f"파이썬 계산 결과: {number_value}의 제곱은 {result}입니다."

        # 버튼을 클릭하면 calculate_square 함수가 실행되도록 연결
        button = document.querySelector("#calc-btn")
        button.addEventListener("click", calculate_square)
    </script>

</body>
</html>
