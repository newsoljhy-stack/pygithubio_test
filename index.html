<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages에서 파이썬 실행하기</title>
    
    <!-- ⚡ 무한 로딩을 해결하기 위한 초경량 마이크로파이썬(MicroPython) 엔진 반영 -->
    <link rel="stylesheet" href="https://pyscript.net">
    <script type="module" src="https://pyscript.net"></script>
</head>
<body>

    <h1>🧮 PyScript 제곱 계산기</h1>
    <p>GitHub Pages(브라우저)에서 서버 없이 파이썬 코드가 직접 실행됩니다.</p>

    <!-- 입력창과 버튼 생성 -->
    <input type="number" id="num-input" value="5" placeholder="숫자를 입력하세요">
    <button id="calc-btn">제곱 계산하기</button>
    
    <!-- 결과 및 상태 출력 공간 -->
    <div id="output-box" style="margin-top: 20px; font-weight: bold; color: blue;">
        로딩 완료! 숫자를 입력하고 버튼을 누르세요.
    </div>

    <!-- 🐍 가볍고 빠른 초경량 파이썬 스크립트 실행 (무한로딩 해결) -->
    <script type="py" target="output-box">
        from pyscript import document, when

        output_element = document.querySelector("#output-box")

        @when("click", "#calc-btn")
        def calculate_square(event):
            input_element = document.querySelector("#num-input")
            
            if not input_element.value:
                output_element.innerText = "숫자를 먼저 입력해주세요!"
                return
                
            try:
                number_value = int(input_element.value)
                result = number_value ** 2
                output_element.innerText = f"파이썬 계산 결과: {number_value}의 제곱은 {result}입니다."
            except Exception as e:
                output_element.innerText = "올바른 숫자를 입력해주세요!"
    </script>

</body>
</html>
