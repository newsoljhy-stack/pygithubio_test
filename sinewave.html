<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파이썬 스타일 데이터 시각화 - Sine Wave</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; background-color: #f8f9fa; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; color: #2c3e50; font-size: 24px; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; }
        .control-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; background: #f1f5f9; padding: 15px; border-radius: 8px; }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: 600; font-size: 14px; color: #475569; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .value-display { font-family: monospace; font-weight: bold; color: #2563eb; }
        #canvas-container { text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; }
        canvas { width: 100%; max-width: 700px; height: auto; }
        .info-text { font-size: 13px; color: #64748b; margin-top: 15px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>📈 파이썬 스타일 과학 연산 시각화 (Sine Wave Generator)</h1>
    <p style="color: #64748b; margin-bottom: 20px;">외부 모듈 차단 환경에서도 완벽히 작동하는 실시간 파형 수학 연산 장치입니다.</p>

    <!-- 실시간 제어 패널 -->
    <div class="control-panel">
        <div class="control-group">
            <label>진폭 (Amplitude): <span id="amp-val" class="value-display">1.0</span></label>
            <input type="range" id="amp-slider" min="0.1" max="2.5" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <label>주파수 (Frequency, Hz): <span id="freq-val" class="value-display">2.0</span></label>
            <input type="range" id="freq-slider" min="0.5" max="10.0" step="0.1" value="2.0">
        </div>
    </div>

    <!-- 그래프가 그려질 고정밀 캔버스 구역 -->
    <div id="canvas-container">
        <canvas id="wave-canvas" width="1400" height="600"></canvas>
    </div>

    <div class="info-text">
        <strong>💡 수식 제어 안내 (Mathematical formula):</strong><br>
        본 그래프는 파이썬 <code>numpy.linspace</code>와 <code>numpy.sin</code> 내부 연산 알고리즘을 모방하여 설계되었습니다.<br>
        수식: <strong>y = Amplitude × sin(2 × π × Frequency × x)</strong> 의 실시간 고정밀 기하학 렌더링 결과입니다.
    </div>
</div>

<!-- ⚡ 외부 CORS 보안 필터를 완벽히 우회하고 고성능 연산을 보장하는 드로잉 스크립트 -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const canvas = document.getElementById("wave-canvas");
        const ctx = canvas.getContext("2d");
        
        const ampSlider = document.getElementById("amp-slider");
        const freqSlider = document.getElementById("freq-slider");
        const ampVal = document.getElementById("amp-val");
        const freqVal = document.getElementById("freq-val");

        function drawSineWave() {
            const amplitude = parseFloat(ampSlider.value);
            const frequency = parseFloat(freqSlider.value);

            // 값 레이블 업데이트
            ampVal.innerText = amplitude.toFixed(1);
            freqVal.innerText = frequency.toFixed(1);

            // 캔버스 초기화 (Matplotlib의 plt.clf() 역할)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const width = canvas.width;
            const height = canvas.height;
            const padding = 80;
            
            const graphWidth = width - padding * 2;
            const graphHeight = height - padding * 2;
            const centerY = height / 2;

            // 1. 그리드 격자 및 축선 그리기 (Matplotlib의 plt.grid() 및 axhline 역할)
            ctx.strokeStyle = "#e2e8f0";
            ctx.lineWidth = 2;
            
            // 가로 격자선
            for (let i = 1; i < 6; i++) {
                const y = padding + (graphHeight / 6) * i;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(width - padding, y);
                ctx.stroke();
            }

            // 중심 축선 (X축)
            ctx.strokeStyle = "#475569";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(padding, centerY);
            ctx.lineTo(width - padding, centerY);
            ctx.stroke();

            // 왼쪽 기준선 (Y축)
            ctx.beginPath();
            ctx.moveTo(padding, padding);
            ctx.lineTo(padding, height - padding);
            ctx.stroke();

            // 2. 파이썬 Numpy 배열 스타일의 샘플링 포인트 연산 후 플로팅
            // np.linspace(0, 1, 1000) 과 동일한 논리 메커니즘
            ctx.strokeStyle = "#0284c7"; // 파이썬 기본블루 색상 스타일
            ctx.lineWidth = 6;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.beginPath();

            const samples = 1000;
            for (let i = 0; i <= samples; i++) {
                // x 값은 0부터 1까지 점진적으로 증가 (Numpy linspace 벡터 생성 방식과 동일)
                const x_ratio = i / samples; 
                
                // 순수 수학적 파이썬 사인 공식 연산: y = A * sin(2 * pi * f * x)
                const y_math = amplitude * Math.sin(2 * Math.PI * frequency * x_ratio);

                // 화면 좌표계로 변환 스케일링 (픽셀 매핑)
                const canvasX = padding + x_ratio * graphWidth;
                // 컴퓨터 그래픽스는 Y가 아래로 갈수록 커지므로 수학 좌표계 반영을 위해 뺄셈 처리
                const canvasY = centerY - (y_math * (graphHeight / 6)); 

                if (i === 0) {
                    ctx.moveTo(canvasX, canvasY);
                } else {
                    ctx.lineTo(canvasX, canvasY);
                }
            }
            ctx.stroke();

            // 3. 차트 폰트 및 텍스트 데코레이션 (Matplotlib 텍스트 렌더링 스타일 구현)
            ctx.fillStyle = "#1e293b";
            ctx.font = "bold 24px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Sine Wave Form: f(x) = A sin(2πfx)", width / 2, padding - 20);
        }

        // 슬라이더 조작 시 실시간 인터랙티브 연산 실행 명령 바인딩
        ampSlider.addEventListener("input", drawSineWave);
        freqSlider.addEventListener("input", drawSineWave);

        // 첫 페이지 로드 시 최초 1회 즉시 드로잉
        drawSineWave();
    });
</script>

</body>
</html>
